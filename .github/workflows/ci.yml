name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install the environment
        run: uv sync --locked --python 3.12

      - name: Lint
        run: uv run ruff check

      # Offline: the tests stub Azure AI Foundry and Jev, so no secrets are needed.
      - name: Test
        run: uv run pytest
