        <title id="pipeline-dark-title">Pipeline with cached paid services</title>
        <desc id="pipeline-dark-desc">Generate, classify and explore stages run left to right. Sentences are classified by TypeSafe AI Jev or, through DSPy, by a foundation model on Azure AI Foundry, and an optional comparison runs both. Each paid service is reached only through a cache, so only cache misses are paid for.</desc>
