[project]
name = "retail-review-knowledge-mining"
version = "0.1.0"
description = "A demo of various techniques for mining insights from semi structured data."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Barry Smart", email = "barry.j.a.smart@gmail.com" }
]
license = "MIT"
dependencies = [
    "ipykernel",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "typesafe-sdk>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/jev_classifier",
    "src/review_charts",
    "src/review_insights",
    "src/review_wrangler",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "pytest",
    "ruff",
]

[tool.uv]
required-version = ">=0.9.0"
default-groups = ["dev"]
# Let uv download the interpreter rather than requiring one in the image.
python-downloads = "automatic"
